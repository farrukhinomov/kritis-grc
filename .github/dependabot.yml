version: 2

# Weekly, grouped updates keep the PR count manageable. A cooldown lets the ecosystem
# catch compromised or broken releases before they reach this repository; security
# updates are not delayed by it.
updates:
  - package-ecosystem: uv
    directories: [/backend, /services/risk-engine]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /services/risk-engine, /frontend]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
