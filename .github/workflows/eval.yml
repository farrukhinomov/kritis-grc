name: Mapping Suggestions eval

# Runs the real model, which costs money: only when what it measures changes (the
# prompt, the answer checks or the gold set), or on demand. Never on pull requests,
# so a fork can't spend the key.
on:
  push:
    branches: [main]
    paths:
      - services/risk-engine/src/risk_engine/mapping/**
      - services/risk-engine/evals/**
  workflow_dispatch:
    inputs:
      reps:
        description: Runs per case
        type: choice
        options: ["1", "3", "5"]
        default: "3"

permissions: {}

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    name: Eval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: eval
    defaults:
      run:
        working-directory: services/risk-engine
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPS: ${{ inputs.reps || '3' }}
    steps:
      - name: Skip without a key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::No ANTHROPIC_API_KEY in the eval environment; nothing was run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.ANTHROPIC_API_KEY != ''
        with:
          enable-cache: true
          cache-dependency-glob: services/risk-engine/uv.lock
      - if: env.ANTHROPIC_API_KEY != ''
        run: uv sync --locked
      - name: Run the eval
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          uv run python -m evals.run --reps "$REPS" --yes
          cat evals/results/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ANTHROPIC_API_KEY != ''
        with:
          name: mapping-suggestions-eval
          path: services/risk-engine/evals/results/
          if-no-files-found: error
