[project]
name = "grc-risk-engine"
version = "0.1.0"
description = "Stateless risk calculation service for the GRC platform"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "python-json-logger>=4.2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# A service is deployed, not distributed: no wheel is built.
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["src/risk_engine/__main__.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "PT", "T20", "DTZ", "FAST", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
