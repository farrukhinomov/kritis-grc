# Trivy's secret scanner, applied to every image CI builds. One narrow exception:
allow-rules:
  # The Anthropic SDK's docstrings show placeholder JSON that the generic
  # "gcp-service-account" pattern matches; they hold no key. Only the SDK's own files
  # are allowed, so a real secret anywhere else in the image still fails the scan.
  - id: anthropic-sdk-docstrings
    description: Placeholder examples in the Anthropic SDK's documentation strings
    path: ^/?app/\.venv/lib/python3\.\d+/site-packages/anthropic/
